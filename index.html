<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>離線語音指令系統 — wav2vec2</title>
<style>
:root {
  --bg:      #0d0d1a;
  --card:    #1c1c35;
  --border:  #2a2a4a;
  --accent:  #6c63ff;
  --accent2: #a78bfa;
  --green:   #34d399;
  --red:     #f87171;
  --yellow:  #fbbf24;
  --blue:    #60a5fa;
  --orange:  #fb923c;
  --purple:  #c084fc;
  --text:    #e2e2f0;
  --muted:   #8888aa;
  --radius:  12px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; padding: 24px 16px 48px;
}

/* ── 標題 ─────────────────────────────────────────── */
.page-title { font-size: 1.5rem; font-weight: 700; letter-spacing: .04em; }
.page-title span { color: var(--accent2); font-weight: 400; font-size: .9rem; }
.subtitle { color: var(--muted); font-size: .82rem; margin-top: 4px; }

/* ── 狀態列 ───────────────────────────────────────── */
#status-bar {
  display: flex; align-items: center; gap: 10px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 18px;
  margin: 16px 0 0; width: 100%; max-width: 860px;
}
.dot {
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--muted); flex-shrink: 0; transition: background .3s;
}
.dot.idle     { background: var(--muted); }
.dot.standby  { background: var(--yellow); animation: blink 1s infinite; }
.dot.listen   { background: var(--blue);   animation: blink .7s infinite; }
.dot.process  { background: var(--orange); }
.dot.speak    { background: var(--purple); }
.dot.await    { background: var(--yellow); animation: blink 1.2s infinite; }
.dot.execute  { background: var(--green); box-shadow: 0 0 8px var(--green); }
.dot.retry    { background: var(--red); }
.dot.sysready { background: var(--green); box-shadow: 0 0 8px var(--green); }
.dot.syserr   { background: var(--red); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
#status-text { font-size: .88rem; color: var(--muted); }
#model-badge {
  margin-left: auto; font-size: .75rem; color: var(--accent2);
  background: #1a1a38; border: 1px solid #3333664d;
  border-radius: 6px; padding: 3px 8px; font-family: monospace;
}

/* ── 主體 grid ────────────────────────────────────── */
.main-grid {
  display: grid; grid-template-columns: 1fr 300px;
  gap: 16px; width: 100%; max-width: 860px; margin-top: 16px;
}
@media(max-width:640px){ .main-grid { grid-template-columns: 1fr; } }

/* ── 面板 ─────────────────────────────────────────── */
.panel {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px;
}
.panel-label {
  font-size: .75rem; font-weight: 600; letter-spacing: .08em;
  color: var(--muted); text-transform: uppercase; margin-bottom: 12px;
}

/* ── 左欄 ─────────────────────────────────────────── */
.col-left { display: flex; flex-direction: column; gap: 14px; }

#waveform-canvas {
  width: 100%; height: 70px; border-radius: 8px;
  background: #0a0a18; display: block; margin-bottom: 12px;
}
#transcript {
  min-height: 50px; background: #0a0a18;
  border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; font-size: 1rem; line-height: 1.6; color: var(--text);
  transition: border-color .3s;
}
#transcript.active { border-color: var(--accent); }
#transcript.empty  { color: var(--muted); font-size: .88rem; font-style: italic; }

.mic-section { display: flex; justify-content: center; padding: 6px 0; }
.mic-btn {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  width: 80px; height: 80px; border-radius: 50%; border: none; cursor: pointer;
  background: linear-gradient(135deg, var(--accent), #8b5cf6);
  color: #fff; box-shadow: 0 4px 20px #6c63ff44; transition: all .2s;
}
.mic-btn:hover:not(.disabled) { transform: scale(1.05); }
.mic-btn .mic-icon  { font-size: 1.6rem; line-height: 1; }
.mic-btn .mic-label { font-size: .62rem; font-weight: 600; letter-spacing: .05em; }
.mic-btn.recording  { background: linear-gradient(135deg,#ef4444,#dc2626); animation: pulse 1s infinite; }
.mic-btn.standby    { background: linear-gradient(135deg,var(--yellow),#d97706); }
.mic-btn.disabled   { opacity: .4; cursor: not-allowed; transform: none !important; animation: none; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 #ef444455} 50%{box-shadow:0 0 0 12px #ef444400} }

.confirm-hint {
  display: none; text-align: center;
  color: var(--yellow); font-size: .83rem;
  background: #1c1800; border: 1px solid var(--yellow);
  border-radius: 8px; padding: 8px 12px;
}
.confirm-hint.show { display: block; }

/* ── 右欄 ─────────────────────────────────────────── */
.col-right { display: flex; flex-direction: column; gap: 14px; }

#action-text {
  min-height: 56px; font-size: .95rem; line-height: 1.6;
  color: var(--muted); font-style: italic;
}
#action-text.matched { color: var(--text); font-style: normal; font-weight: 500; }
#action-vehicle { font-size: .75rem; color: var(--accent2); margin-top: 4px; font-family: monospace; }
#action-api     { font-size: .72rem; color: var(--muted);   margin-top: 2px;  font-family: monospace; }

.history-list {
  display: flex; flex-direction: column; gap: 6px;
  max-height: 220px; overflow-y: auto;
}
.hist-item {
  font-size: .78rem; font-family: monospace;
  padding: 6px 10px; border-radius: 6px;
  background: #0a0a18; border: 1px solid var(--border);
}
.hist-item .hist-ts     { color: var(--muted); margin-right: 6px; }
.hist-item.success .hist-action { color: var(--green); }
.hist-item.fail    .hist-action { color: var(--red); }
.hist-empty { color: var(--muted); font-size: .82rem; font-style: italic; }

/* ── 執行覆蓋層 ───────────────────────────────────── */
.exec-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(8,8,22,.96); z-index: 100;
  flex-direction: column; align-items: center; justify-content: center; gap: 20px;
}
.exec-overlay.show { display: flex; }
.exec-title   { font-size: 1.1rem; font-weight: 700; color: var(--accent2); letter-spacing: .1em; }
.exec-vehicle { font-family: monospace; font-size: .78rem; line-height: 1.4; color: var(--accent); white-space: pre; text-align: center; }
.exec-action  { font-size: 1rem; font-weight: 600; color: var(--text); text-align: center; }
.exec-api     { font-size: .78rem; color: var(--muted); font-family: monospace; }
.progress-track { width: 320px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill  { height: 100%; width: 0%; background: var(--green); border-radius: 3px; transition: width .05s linear; }

</style>
</head>
<body>

<div class="page-title">離線語音指令系統 <span>powered by wav2vec 2.0</span></div>
<div class="subtitle">完全離線推理，無需網路連線 &nbsp;|&nbsp; 說出 <code style="color:var(--accent2)">Hello Tester</code> 喚醒系統</div>

<!-- 狀態列 -->
<div id="status-bar">
  <div class="dot" id="status-dot"></div>
  <span id="status-text">正在連接伺服器...</span>
  <div id="model-badge">facebook/wav2vec2-base-960h</div>
</div>

<!-- 主體 grid -->
<div class="main-grid">

  <!-- 左欄：錄音 + 辨識文字 -->
  <div class="col-left">
    <div class="panel">
      <div class="panel-label">語音轉文字</div>
      <canvas id="waveform-canvas"></canvas>
      <div id="transcript" class="empty">(awaiting input)</div>
    </div>

    <div class="mic-section">
      <button class="mic-btn disabled" id="mic-btn" onclick="handleMicClick()">
        <span class="mic-icon">🎤</span>
        <span class="mic-label" id="mic-label">等待模型</span>
      </button>
    </div>

    <div class="confirm-hint" id="confirm-hint">
      🎙 說出 Yes 或 No，或按 Esc 取消
    </div>
  </div>

  <!-- 右欄：識別動作 + 執行記錄 -->
  <div class="col-right">
    <div class="panel">
      <div class="panel-label">識別動作</div>
      <div id="action-text">(waiting)</div>
      <div id="action-vehicle"></div>
      <div id="action-api"></div>
    </div>

    <div class="panel">
      <div class="panel-label">執行記錄</div>
      <div class="history-list" id="history-list">
        <div class="hist-empty">尚無記錄</div>
      </div>
    </div>
  </div>

</div>

<!-- 執行覆蓋層 -->
<div class="exec-overlay" id="exec-panel">
  <div class="exec-title">⚙ 動作執行中</div>
  <div class="exec-vehicle" id="exec-vehicle"></div>
  <div class="exec-action"  id="exec-action-name"></div>
  <div class="exec-api"     id="exec-api-label"></div>
  <div class="progress-track">
    <div class="progress-fill" id="progress-fill"></div>
  </div>
</div>


<script>
// ── 指令定義 ──────────────────────────────────────────────────────────────────
const COMMANDS = [
  {
    id: 'outdoor_script',
    keywords: ['outdoor script', 'outdoor'],
    label: 'Run Outdoor Script Number 1',
    vehicle: 'UAV',
    api: 'POST /api/v1/outdoor/script/1',
  },
  {
    id: 'indoor_script_1',
    keywords: ['indoor script number 1', 'indoor script number one', 'indoor 1', 'indoor one'],
    label: 'Run Indoor Script Number 1',
    vehicle: 'AMR',
    api: 'POST /api/v1/indoor/script/1',
  },
  {
    id: 'indoor_script_2',
    keywords: ['indoor script number 2', 'indoor script number two', 'indoor 2', 'indoor two'],
    label: 'Run Indoor Script Number 2',
    vehicle: 'AMR',
    api: 'POST /api/v1/indoor/script/2',
  },
];

const WAKE_WORDS = [
  'hello tester', 'hello test', 'helo tester', 'yellow tester', 'hello texture',
  'hello taster', 'hell tester', 'helo test', 'hello textur',
  'ello tester', 'low tester',
  'hello dester', 'hello des', 'dester',
  'tester',
];
const POSITIVE   = ['yes', 'correct', 'proceed', 'confirm', 'execute', 'go', 'sure', 'okay', 'ok', 'yep'];
const NEGATIVE   = ['no', 'cancel', 'abort', 'stop', 'negative'];

const ASCII_ART = {
  AMR: `█████╗ ███╗   ███╗██████╗
██╔══██╗████╗ ████║██╔══██╗
███████║██╔████╔██║██████╔╝
██╔══██║██║╚██╔╝██║██╔══██╗
██║  ██║██║ ╚═╝ ██║██║  ██║
╚═╝  ╚═╝╚═╝     ╚═╝╚═╝  ╚═╝`,
  UAV: `██╗   ██╗ █████╗ ██╗   ██╗
██║   ██║██╔══██╗██║   ██║
██║   ██║███████║██║   ██║
██║   ██║██╔══██║╚██╗ ██╔╝
╚██████╔╝██║  ██║ ╚████╔╝
 ╚═════╝ ╚═╝  ╚═╝  ╚═══╝`,
};

// ── 狀態機 ────────────────────────────────────────────────────────────────────
let state = 'IDLE';
let modelReady = false;
let pendingCmd = null;

const UI = {
  dot:         document.getElementById('status-dot'),
  statusText:  document.getElementById('status-text'),
  micBtn:      document.getElementById('mic-btn'),
  micLabel:    document.getElementById('mic-label'),
  transcript:  document.getElementById('transcript'),
  actionText:  document.getElementById('action-text'),
  actionVehicle: document.getElementById('action-vehicle'),
  actionApi:   document.getElementById('action-api'),
  confirmHint: document.getElementById('confirm-hint'),
  histList:    document.getElementById('history-list'),
  execPanel:   document.getElementById('exec-panel'),
  execVehicle: document.getElementById('exec-vehicle'),
  execAction:  document.getElementById('exec-action-name'),
  execApi:     document.getElementById('exec-api-label'),
  progress:    document.getElementById('progress-fill'),
  canvas:      document.getElementById('waveform-canvas'),
};
const ctx2d = UI.canvas.getContext('2d');

const STATE_MAP = {
  IDLE:           { dotCls: 'idle',    status: '模型就緒 — 按下麥克風開始',                    label: '點擊開始' },
  STANDBY:        { dotCls: 'standby', status: '請說 Hello Tester（說完後自動偵測）',           label: '取消',    sby: true },
  LISTEN_CMD:     { dotCls: 'listen',  status: '請說出指令（說完後自動偵測）',                   label: '取消',    rec: true },
  PROCESS:        { dotCls: 'process', status: '分析中…',                                       label: '處理中',  dis: true },
  SPEAK_ACTION:   { dotCls: 'speak',   status: '播報動作中…',                                   label: '播報中',  dis: true },
  AWAIT_CONFIRM:  { dotCls: 'await',   status: '等待確認 — 按麥克風說 Yes 或 No',               label: '確認',    confirm: true },
  LISTEN_CONFIRM: { dotCls: 'listen',  status: '請說 Yes 或 No（說完後自動偵測）',              label: '取消',    rec: true, confirm: true },
  EXECUTE:        { dotCls: 'execute', status: '執行動作中…',                                   label: '執行中',  dis: true },
  RETRY:          { dotCls: 'retry',   status: '無法辨識，請重試',                               label: '重試' },
};

function setState(s) {
  state = s;
  const cfg = STATE_MAP[s];
  if (!cfg) return;

  UI.dot.className = `dot ${cfg.dotCls}`;
  UI.statusText.textContent = cfg.status;
  UI.micLabel.textContent = cfg.label;
  UI.micBtn.className = 'mic-btn';
  UI.confirmHint.className = 'confirm-hint';

  if (cfg.rec)     UI.micBtn.classList.add('recording');
  if (cfg.dis)     UI.micBtn.classList.add('disabled');
  if (cfg.sby)     UI.micBtn.classList.add('standby');
  if (cfg.confirm) UI.confirmHint.classList.add('show');
}

// ── 錄音狀態 ──────────────────────────────────────────────────────────────────
let isRecording = false;
let recordingCancelled = false;
let mediaRecorder = null;
let audioChunks = [];
let audioCtx = null;
let analyser = null;
let animFrameId = null;
let micStream = null;

// ── VAD（靜音自動停止）────────────────────────────────────────────────────────
const VAD_THRESHOLD        = 0.06;  // 語音 RMS 門檻（需正常說話音量）
const VAD_SILENCE_MS       = 900;   // 靜音超過此時間後自動停止（縮短以加快回應）
const VAD_MAX_MS           = 10000; // 最長錄音時間（保險機制）
const VAD_MIN_SPEECH_FRAMES = 5;    // 需連續 5 幀（約 500ms）才視為語音，過濾瞬間雜音

let vadHasSpeech    = false;
let vadSpeechFrames = 0;
let vadSilenceTimer = null;
let vadMaxTimer     = null;
let vadInterval     = null;

function startVAD() {
  vadHasSpeech    = false;
  vadSpeechFrames = 0;
  vadSilenceTimer = null;
  vadMaxTimer = setTimeout(() => { if (isRecording) stopRecording(); }, VAD_MAX_MS);
  vadInterval = setInterval(() => {
    if (!analyser || !isRecording) return;
    const data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteTimeDomainData(data);
    let sum = 0;
    for (let i = 0; i < data.length; i++) { const v = (data[i] - 128) / 128; sum += v * v; }
    const rms = Math.sqrt(sum / data.length);
    if (rms > VAD_THRESHOLD) {
      vadSpeechFrames++;
      if (vadSpeechFrames >= VAD_MIN_SPEECH_FRAMES) vadHasSpeech = true;
      if (vadSilenceTimer) { clearTimeout(vadSilenceTimer); vadSilenceTimer = null; }
    } else {
      vadSpeechFrames = 0;
      if (vadHasSpeech && !vadSilenceTimer) {
        vadSilenceTimer = setTimeout(() => { if (isRecording) stopRecording(); }, VAD_SILENCE_MS);
      }
    }
  }, 100);
}

function stopVAD() {
  clearInterval(vadInterval);
  clearTimeout(vadSilenceTimer);
  clearTimeout(vadMaxTimer);
  vadInterval = vadSilenceTimer = vadMaxTimer = null;
  vadHasSpeech = false;
  vadSpeechFrames = 0;
}

// ── 麥克風按鈕邏輯 ────────────────────────────────────────────────────────────
function handleMicClick() {
  if (!modelReady) return;
  if (UI.micBtn.classList.contains('disabled')) return;

  if (isRecording) {
    recordingCancelled = true;
    stopRecording();
    setState('IDLE');
    return;
  }

  switch (state) {
    case 'IDLE':
    case 'RETRY':
      setState('STANDBY');
      startRecording();
      break;
    case 'STANDBY':
      setState('IDLE');
      break;
    case 'AWAIT_CONFIRM':
      setState('LISTEN_CONFIRM');
      startRecording();
      break;
    default:
      break;
  }
}

async function startRecording() {
  if (isRecording) return;
  isRecording = true;
  audioChunks = [];

  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, sampleRate: 16000 } });
  } catch (e) {
    isRecording = false;
    setState('IDLE');
    return;
  }

  audioCtx = new AudioContext();
  const source = audioCtx.createMediaStreamSource(micStream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  source.connect(analyser);
  drawWaveform();

  mediaRecorder = new MediaRecorder(micStream);
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
  mediaRecorder.onstop = handleRecordingStop;
  mediaRecorder.start();
  playMicBeep();
  startVAD();
}

function stopRecording() {
  if (!isRecording) return;
  isRecording = false;
  stopVAD();
  mediaRecorder?.stop();
  micStream?.getTracks().forEach(t => t.stop());
  cancelAnimationFrame(animFrameId);
  analyser = null;
  drawIdle();
}

// ── 錄音結束 ──────────────────────────────────────────────────────────────────
async function handleRecordingStop() {
  if (recordingCancelled) {
    recordingCancelled = false;
    return;
  }
  const prevState = state;
  setState('PROCESS');

  const blob = new Blob(audioChunks, { type: 'audio/webm' });
  const wavBlob = await convertToWav(blob);

  let text = '';
  try {
    const fd = new FormData();
    fd.append('audio', wavBlob, 'audio.wav');
    const res = await fetch('/api/transcribe', { method: 'POST', body: fd });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    text = (data.text || '').trim();
  } catch {
    showTranscript('（辨識失敗）');
    setState(prevState === 'LISTEN_CONFIRM' ? 'AWAIT_CONFIRM' : 'RETRY');
    return;
  }

  showTranscript(text);

  if (prevState === 'STANDBY')        handleWakeWord(text);
  else if (prevState === 'LISTEN_CMD')     handleCommand(text);
  else if (prevState === 'LISTEN_CONFIRM') handleConfirm(text);
}

// ── 喚醒詞偵測 ────────────────────────────────────────────────────────────────
function handleWakeWord(text) {
  const lower = text.toLowerCase().replace(/\s+/g, ' ').trim();
  const found = WAKE_WORDS.some(w => lower.includes(w));
  if (found) {
    playStartBeep();
    setState('LISTEN_CMD');
    setTimeout(() => startRecording(), 600);
  } else {
    UI.statusText.textContent = '未偵測到喚醒詞，請說 Hello Tester';
    setTimeout(() => {
      setState('STANDBY');
      startRecording();
    }, 1200);
  }
}

// ── 指令匹配 ──────────────────────────────────────────────────────────────────
function handleCommand(text) {
  const lower = text.toLowerCase().replace(/\s+/g, ' ').trim();
  const cmd = COMMANDS.find(c => c.keywords.some(kw => lower.includes(kw)));

  if (!cmd) {
    UI.actionText.textContent = '無法辨識指令';
    UI.actionText.className = '';
    UI.actionVehicle.textContent = '';
    UI.actionApi.textContent = '';
    setState('RETRY');
    speak('Cannot recognize. Please try again.', () => {
      setState('STANDBY');
      setTimeout(() => startRecording(), 600);
    });
    return;
  }

  pendingCmd = cmd;
  UI.actionText.textContent = cmd.label;
  UI.actionText.className = 'matched';
  UI.actionVehicle.textContent = `Vehicle: ${cmd.vehicle}`;
  UI.actionApi.textContent = cmd.api;

  setState('SPEAK_ACTION');
  speak(cmd.label, () => setState('AWAIT_CONFIRM'));
}

// ── 確認回覆 ──────────────────────────────────────────────────────────────────
function handleConfirm(text) {
  const lower = text.toLowerCase();
  const pos = POSITIVE.some(k => lower.includes(k));
  const neg = NEGATIVE.some(k => lower.includes(k));

  if (pos && !neg) {
    executeAction();
  } else if (neg) {
    addHistory(pendingCmd, false);
    pendingCmd = null;
    setState('RETRY');
    speak('Canceled.', () => setState('IDLE'));
  } else {
    setState('AWAIT_CONFIRM');
    speak('Cannot recognize. Please say yes or no.', () => {});
  }
}

// ── 執行動作 ──────────────────────────────────────────────────────────────────
function executeAction() {
  if (!pendingCmd) return;
  const cmd = pendingCmd;
  pendingCmd = null;
  setState('EXECUTE');

  UI.execVehicle.textContent = ASCII_ART[cmd.vehicle] || '';
  UI.execAction.textContent  = cmd.label;
  UI.execApi.textContent     = cmd.api;
  UI.progress.style.width    = '0%';
  UI.execPanel.classList.add('show');

  playExecSound(cmd.vehicle);

  const dur = 3600, step = 50;
  let elapsed = 0;
  const timer = setInterval(() => {
    elapsed += step;
    UI.progress.style.width = Math.min(100, (elapsed / dur) * 100) + '%';
    if (elapsed >= dur) {
      clearInterval(timer);
      UI.execPanel.classList.remove('show');
      addHistory(cmd, true);
      setState('IDLE');
      speak(`${cmd.label} completed.`);
    }
  }, step);
}

// ── 歷史記錄 ──────────────────────────────────────────────────────────────────
function addHistory(cmd, success) {
  const empty = UI.histList.querySelector('.hist-empty');
  if (empty) empty.remove();

  const now = new Date();
  const ts = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const el = document.createElement('div');
  el.className = `hist-item ${success ? 'success' : 'fail'}`;
  el.innerHTML = `<span class="hist-ts">${ts}</span><span class="hist-action">${cmd.vehicle}: ${cmd.label}</span>`;
  UI.histList.prepend(el);
}

// ── TTS ───────────────────────────────────────────────────────────────────────
function speak(text, onEnd) {
  if (!window.speechSynthesis) { onEnd?.(); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  if (onEnd) u.onend = onEnd;
  window.speechSynthesis.speak(u);
}

// ── 音效 ──────────────────────────────────────────────────────────────────────
function playMicBeep() {
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ac.createOscillator();
  const g = ac.createGain();
  osc.connect(g); g.connect(ac.destination);
  osc.type = 'sine';
  osc.frequency.value = 880;
  g.gain.setValueAtTime(0.18, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.12);
  osc.start(ac.currentTime);
  osc.stop(ac.currentTime + 0.15);
}

function playStartBeep() {
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const gain = ac.createGain();
  gain.connect(ac.destination);
  [[600, 0, 0.08], [900, 0.1, 0.08], [1200, 0.2, 0.12]].forEach(([freq, start, dur]) => {
    const osc = ac.createOscillator();
    osc.connect(gain);
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.25, ac.currentTime + start);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + start + dur);
    osc.start(ac.currentTime + start);
    osc.stop(ac.currentTime + start + dur + 0.05);
  });
}

function playExecSound(vehicle) {
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const T = ac.currentTime;
  if (vehicle === 'AMR') {
    [0, 0.58, 1.16, 1.74, 2.32, 2.9].forEach((start, i) => {
      const osc = ac.createOscillator();
      const g = ac.createGain();
      osc.connect(g); g.connect(ac.destination);
      osc.type = 'square';
      osc.frequency.value = i % 2 === 0 ? 220 : 300;
      g.gain.setValueAtTime(0.001, T + start);
      g.gain.linearRampToValueAtTime(0.14, T + start + 0.02);
      g.gain.setValueAtTime(0.14, T + start + 0.18);
      g.gain.exponentialRampToValueAtTime(0.001, T + start + 0.38);
      osc.start(T + start);
      osc.stop(T + start + 0.42);
    });
  } else if (vehicle === 'UAV') {
    const osc = ac.createOscillator();
    const filter = ac.createBiquadFilter();
    const g = ac.createGain();
    osc.connect(filter); filter.connect(g); g.connect(ac.destination);
    filter.type = 'lowpass'; filter.frequency.value = 900;
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(140, T);
    osc.frequency.exponentialRampToValueAtTime(520, T + 1.2);
    osc.frequency.setValueAtTime(505, T + 1.8);
    osc.frequency.setValueAtTime(530, T + 2.4);
    osc.frequency.setValueAtTime(510, T + 3.0);
    osc.frequency.setValueAtTime(520, T + 3.4);
    g.gain.setValueAtTime(0.001, T);
    g.gain.linearRampToValueAtTime(0.13, T + 0.5);
    g.gain.setValueAtTime(0.11, T + 3.2);
    g.gain.exponentialRampToValueAtTime(0.001, T + 3.6);
    osc.start(T);
    osc.stop(T + 3.7);
  }
}

// ── 辨識文字顯示 ──────────────────────────────────────────────────────────────
function showTranscript(text) {
  UI.transcript.className = text ? 'active' : 'empty';
  UI.transcript.textContent = text || '（無內容）';
}

// ── 波形視覺化 ────────────────────────────────────────────────────────────────
function resizeCanvas() {
  UI.canvas.width  = UI.canvas.offsetWidth  * devicePixelRatio;
  UI.canvas.height = UI.canvas.offsetHeight * devicePixelRatio;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function drawIdle() {
  const W = UI.canvas.width, H = UI.canvas.height;
  ctx2d.clearRect(0, 0, W, H);
  ctx2d.strokeStyle = '#2a2a4a';
  ctx2d.lineWidth = 1;
  ctx2d.beginPath();
  ctx2d.moveTo(0, H / 2); ctx2d.lineTo(W, H / 2);
  ctx2d.stroke();
}
drawIdle();

function drawWaveform() {
  if (!analyser) return;
  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteTimeDomainData(data);
  const W = UI.canvas.width, H = UI.canvas.height;
  ctx2d.clearRect(0, 0, W, H);
  ctx2d.strokeStyle = '#6c63ff';
  ctx2d.lineWidth = 2;
  ctx2d.beginPath();
  const sliceW = W / data.length;
  let x = 0;
  for (let i = 0; i < data.length; i++) {
    const y = (data[i] / 128.0 * H) / 2;
    i === 0 ? ctx2d.moveTo(x, y) : ctx2d.lineTo(x, y);
    x += sliceW;
  }
  ctx2d.stroke();
  animFrameId = requestAnimationFrame(drawWaveform);
}

// ── 音訊轉 WAV (16kHz mono) ───────────────────────────────────────────────────
async function convertToWav(blob) {
  const arrayBuffer = await blob.arrayBuffer();
  const ac = new AudioContext();
  let decoded;
  try {
    decoded = await ac.decodeAudioData(arrayBuffer);
  } catch { return blob; }
  finally { ac.close(); }

  const numSamples = Math.ceil(decoded.duration * 16000);
  const offCtx = new OfflineAudioContext(1, numSamples, 16000);
  const src = offCtx.createBufferSource();
  src.buffer = decoded;
  src.connect(offCtx.destination);
  src.start(0);
  const rendered = await offCtx.startRendering();
  return encodeWAV(rendered.getChannelData(0), 16000);
}

function encodeWAV(samples, sampleRate) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buf);
  const writeStr = (off, str) => { for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i)); };
  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + samples.length * 2, true);
  writeStr(8, 'WAVE'); writeStr(12, 'fmt ');
  view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  writeStr(36, 'data');
  view.setUint32(40, samples.length * 2, true);
  let off = 44;
  for (let i = 0; i < samples.length; i++, off += 2) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Blob([buf], { type: 'audio/wav' });
}

// ── 輪詢模型狀態 ──────────────────────────────────────────────────────────────
async function pollStatus() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    if (data.ready) {
      modelReady = true;
      setState('IDLE');
    } else if (data.error) {
      UI.dot.className = 'dot syserr';
      UI.statusText.textContent = '模型載入失敗：' + data.error;
    } else {
      UI.statusText.textContent = data.loading ? '正在載入模型（首次約需 1~3 分鐘）...' : '等待伺服器...';
      setTimeout(pollStatus, 2000);
    }
  } catch {
    UI.statusText.textContent = '無法連線到 Python 伺服器（請先執行 server.py）';
    setTimeout(pollStatus, 3000);
  }
}
pollStatus();

// ── 鍵盤快捷鍵 ────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
    e.preventDefault();
    handleMicClick();
  }
  if (e.code === 'Escape') {
    if (isRecording) stopRecording();
    pendingCmd = null;
    setState('IDLE');
  }
});
